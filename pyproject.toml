[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-network"
version = "0.0.6"
description = "The local network of the house, watched: its devices, its internet and what changes (A.R.M.O.R.)"
requires-python = ">=3.11"

[project.scripts]
armor-network = "armor_network.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
armor_network = ["data/*.gz"]
