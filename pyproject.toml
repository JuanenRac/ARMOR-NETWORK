[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-network"
version = "0.1.5"
description = "The local network of the house, watched: its devices, its internet and what changes (A.R.M.O.R.)"
requires-python = ">=3.11"

[project.scripts]
armor-network = "armor_network.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
armor_network = ["data/*.gz"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
# The shared contract package lives in a sibling checkout and is imported only when present.
module = ["armor_common"]
ignore_missing_imports = true

[tool.armor]
# ruff still reports a few bugbear findings; the shared lint and type-check step stays off until they are fixed
ci_lint = false
